name: Build RecapMod

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Build NickelHook Plugin
      run: |
        docker run --rm \
          -v $(pwd):/workspace \
          -w /workspace \
          ghcr.io/pgaskin/nickeltc:1.0 \
          bash -c "make clean && make koboroot"
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RecapMod-KoboRoot
        path: KoboRoot.tgz
