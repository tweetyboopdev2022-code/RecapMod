name: Build RecapMod Plugin

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Setup Build Environment
      run: |
        sudo apt-get update
        # Install complete ARM cross-compilation and Qt5 dependencies
        sudo apt-get install -y gcc g++ make crossbuild-essential-armhf qt5-default libqt5core5a libqt5gui5 libqt5widgets5 libqt5dbus5 libqt5network5
        
    - name: Build RecapMod Plugin
      run: |
        echo "Building RecapMod plugin..."
        # Clean previous builds
        make clean
        
        # Set proper ARM cross-compilation environment
        export CC=arm-linux-gnueabihf-gcc
        export CXX=arm-linux-gnueabihf-g++
        
        # Build the plugin
        make
        
    - name: Verify Plugin Binary
      run: |
        if [ -f "librecapmod.so" ]; then
          echo "Plugin built successfully!"
          ls -la librecapmod.so
        else
          echo "Plugin build failed!"
          echo "Files in directory:"
          ls -la
          exit 1
        fi
        
    - name: Create KoboRoot Structure
      run: |
        echo "Creating KoboRoot structure..."
        mkdir -p KoboRoot/usr/lib
        cp librecapmod.so KoboRoot/usr/lib/
        tar -czf KoboRoot.tgz KoboRoot
        
    - name: Upload KoboRoot Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RecapMod-KoboRoot
        path: KoboRoot.tgz
        if-no-files-found: error
        
    - name: Upload Plugin Binary Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RecapMod-Plugin
        path: librecapmod.so
        if-no-files-found: error
