name: Build RecapMod Plugin

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Setup Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gcc g++ make cmake qt5-default libqt5core5a libqt5gui5 libqt5widgets5
        
    - name: Build RecapMod Plugin
      run: |
        cd RecapMod
        echo "Building RecapMod plugin..."
        make clean
        make
        
    - name: Create KoboRoot Structure
      run: |
        cd RecapMod
        echo "Creating KoboRoot structure..."
        mkdir -p KoboRoot/usr/lib
        cp librecapmod.so KoboRoot/usr/lib/
        tar -czf KoboRoot.tgz KoboRoot
        
    - name: Upload KoboRoot Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RecapMod-KoboRoot
        path: RecapMod/KoboRoot.tgz
        if-no-files-found: error
        
    - name: Upload Plugin Binary Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RecapMod-Plugin
        path: RecapMod/librecapmod.so
        if-no-files-found: error

